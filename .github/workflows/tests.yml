name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      # A transient failure (such as a rate limited download) does not cancel the whole matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        filament: [ 4.*, 5.* ]
        include:
          - laravel: 13.*
            carbon: 3.*
            testbench: 11.*
          - laravel: 12.*
            carbon: 3.*
            testbench: 10.*
        exclude:
          - laravel: 13.*
            php: 8.2
          - php: 8.2
            filament: 5.*
          - laravel: 13.*
            filament: 4.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # The jobs of the matrix download their packages at the same time: without cache, GitHub may answer 429.
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-f${{ matrix.filament }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-f${{ matrix.filament }}-

      - name: Install Dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}" "nesbot/carbon:${{ matrix.carbon }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Tests
        run: composer test:unit

  # Creates the release (and its tag) of the version at the top of CHANGELOG.md, once all the tests pass on main.
  # See README, "Publishing a release".
  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First "## [x.y.z]" heading of CHANGELOG.md, "## [Unreleased]" is skipped.
          VERSION=$(sed -nE '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/{s/^## \[([0-9.]+)\].*/\1/p;q}' CHANGELOG.md)
          if [ -z "$VERSION" ]; then
            echo "No \"## [x.y.z]\" version in CHANGELOG.md."
            exit 1
          fi

          # Version already released (push without a version bump, re-run): nothing to do.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists: no new version to release."
            exit 0
          fi

          # Release notes: the section of the version in CHANGELOG.md, without its heading.
          awk -v version="$VERSION" '/^## \[/ { if (found) exit; found = index($0, "## [" version "]") == 1; next } found' CHANGELOG.md \
            | sed '/./,$!d' > "$RUNNER_TEMP/release-notes.md"

          echo "Creating the release $VERSION on $GITHUB_SHA"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
